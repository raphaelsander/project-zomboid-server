---
- name: Install and manage a Project Zomboid dedicated server
  hosts: pz_servers
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    pz_user: pzuser
    pz_group: "{{ pz_user }}"
    pz_home: "/home/{{ pz_user }}"
    pz_install_dir: /opt/pzserver
    pz_server_name: zomboid
    pz_app_id: "380870"
    pz_workshop_app_id: "108600"
    pz_steamcmd_path: /usr/games/steamcmd
    pz_save_wait_seconds: 30
    pz_java_heap_min: 4G
    pz_java_heap_max: 6G
    pz_service_memory_high: 8G
    pz_service_memory_max: 9G
    pz_service_memory_swap_max: 256M
    pz_config_dir: /etc/project-zomboid
    pz_launcher_config: "{{ pz_config_dir }}/ProjectZomboid64.json"
    pz_rcon_port: 27015
    pz_maintenance_interval_minutes: 30
    pz_console_script: /usr/local/bin/pz-console
    pz_maintenance_script: /usr/local/sbin/pz-maintenance
    pz_workshop_script: /usr/local/sbin/pz-workshop
    pz_log_file: /var/log/pz-maintenance.log

  pre_tasks:
    - name: Validate operating system and server settings
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
          - pz_server_name is match("^[A-Za-z0-9_-]+$")
          - pz_save_wait_seconds | int >= 0
          - pz_maintenance_interval_minutes | string is match("^[1-9][0-9]?$")
          - pz_maintenance_interval_minutes | int <= 59
          - pz_java_heap_min is match("^[1-9][0-9]*[kKmMgGtT]?$")
          - pz_java_heap_max is match("^[1-9][0-9]*[kKmMgGtT]?$")
          - (pz_java_heap_min | human_to_bytes) <= (pz_java_heap_max | human_to_bytes)
          - (pz_java_heap_max | human_to_bytes) < (pz_service_memory_high | human_to_bytes)
          - (pz_java_heap_max | human_to_bytes) < (pz_service_memory_max | human_to_bytes)
          - pz_admin_username is defined
          - pz_admin_username | default('') is match("^[A-Za-z0-9_-]{1,32}$")
          - pz_admin_password is defined
          - pz_admin_password | default('') is match("^[A-Za-z0-9_-]{16,128}$")
          - pz_rcon_password is defined
          - pz_rcon_password | default('') is match("^[A-Za-z0-9_-]{32,}$")
          - pz_rcon_port | int >= 1
          - pz_rcon_port | int <= 65535
        fail_msg: >-
          This playbook supports Debian/Ubuntu, a server name containing only
          letters, digits, underscores or hyphens, a valid maintenance
          interval, a valid RCON port, valid Java heap and service memory
          limits, and admin and RCON credentials supplied through Ansible
          Vault. Admin passwords must be 16-128 URL-safe characters and RCON
          passwords must be at least 32 URL-safe characters.

  tasks:
    - name: Enable Ubuntu multiverse repository for SteamCMD
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} multiverse"
        state: present
      when: ansible_facts["distribution"] == "Ubuntu"

    - name: Check configured foreign architectures
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: pz_foreign_architectures
      changed_when: false

    - name: Enable 32-bit packages required by SteamCMD
      ansible.builtin.command: dpkg --add-architecture i386
      when: "'i386' not in pz_foreign_architectures.stdout_lines"

    - name: Install SteamCMD and server runtime tools
      ansible.builtin.apt:
        name:
          - cron
          - steamcmd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure cron is enabled
      ansible.builtin.service:
        name: cron
        state: started
        enabled: true

    - name: Create Project Zomboid service group
      ansible.builtin.group:
        name: "{{ pz_group }}"
        state: present

    - name: Create Project Zomboid service account
      ansible.builtin.user:
        name: "{{ pz_user }}"
        group: "{{ pz_group }}"
        create_home: true
        home: "{{ pz_home }}"
        shell: /bin/bash
        state: present

    - name: Create Ansible temporary directory for the service account
      ansible.builtin.file:
        path: "{{ pz_home }}/.ansible/tmp"
        state: directory
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0700"

    - name: Create Project Zomboid server configuration directory
      ansible.builtin.file:
        path: "{{ pz_home }}/Zomboid/Server"
        state: directory
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0750"

    - name: Configure Project Zomboid server settings
      ansible.builtin.template:
        src: templates/zomboid.ini
        dest: "{{ pz_home }}/Zomboid/Server/{{ pz_server_name }}.ini"
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      notify: Restart Project Zomboid

    - name: Configure Project Zomboid sandbox settings
      ansible.builtin.template:
        src: templates/zomboid_SandboxVars.lua
        dest: "{{ pz_home }}/Zomboid/Server/{{ pz_server_name }}_SandboxVars.lua"
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      notify: Restart Project Zomboid

    - name: Configure Project Zomboid spawn regions
      ansible.builtin.template:
        src: templates/zomboid_spawnregions.lua
        dest: "{{ pz_home }}/Zomboid/Server/{{ pz_server_name }}_spawnregions.lua"
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      notify: Restart Project Zomboid

    - name: Install protected Project Zomboid administrator credentials
      ansible.builtin.template:
        src: templates/pz-admin-credentials.j2
        dest: "{{ pz_home }}/.pz-admin-credentials"
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      no_log: true
      notify: Restart Project Zomboid

    - name: Configure Project Zomboid RCON port
      ansible.builtin.lineinfile:
        path: "{{ pz_home }}/Zomboid/Server/{{ pz_server_name }}.ini"
        regexp: "^RCONPort="
        line: "RCONPort={{ pz_rcon_port | int }}"
        create: true
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      notify: Restart Project Zomboid

    - name: Configure Project Zomboid RCON password
      ansible.builtin.lineinfile:
        path: "{{ pz_home }}/Zomboid/Server/{{ pz_server_name }}.ini"
        regexp: "^RCONPassword="
        line: "RCONPassword={{ pz_rcon_password }}"
        create: true
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0600"
      no_log: true
      notify: Restart Project Zomboid

    - name: Create server installation directory
      ansible.builtin.file:
        path: "{{ pz_install_dir }}"
        state: directory
        owner: "{{ pz_user }}"
        group: "{{ pz_group }}"
        mode: "0755"

    - name: Create Project Zomboid launcher configuration directory
      ansible.builtin.file:
        path: "{{ pz_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Project Zomboid dedicated server
      ansible.builtin.command:
        argv:
          - "{{ pz_steamcmd_path }}"
          - +force_install_dir
          - "{{ pz_install_dir }}"
          - +login
          - anonymous
          - +app_update
          - "{{ pz_app_id }}"
          - validate
          - +quit
        creates: "{{ pz_install_dir }}/start-server.sh"
      become_user: "{{ pz_user }}"
      environment:
        HOME: "{{ pz_home }}"

    - name: Configure Project Zomboid Java launcher
      ansible.builtin.template:
        src: templates/ProjectZomboid64.json.j2
        dest: "{{ pz_launcher_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Project Zomboid

    - name: Install server console helper
      ansible.builtin.template:
        src: templates/pz-console.py.j2
        dest: "{{ pz_console_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install Project Zomboid Workshop maintenance helper
      ansible.builtin.template:
        src: templates/pz-workshop.py.j2
        dest: "{{ pz_workshop_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install server maintenance script
      ansible.builtin.template:
        src: templates/pz-maintenance.sh.j2
        dest: "{{ pz_maintenance_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/pz-server.service.j2
        dest: /etc/systemd/system/project-zomboid.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Project Zomboid

    - name: Enable and start Project Zomboid
      ansible.builtin.systemd_service:
        name: project-zomboid
        enabled: true
        state: started
        daemon_reload: true

    - name: Schedule periodic save, update and restart
      ansible.builtin.cron:
        name: Project Zomboid save, update and restart
        user: root
        minute: "*/{{ pz_maintenance_interval_minutes | int }}"
        hour: "*"
        job: "flock -n /run/lock/pz-{{ pz_server_name }}-maintenance-cron.lock {{ pz_maintenance_script }} >> {{ pz_log_file }} 2>&1"
        state: present

  handlers:
    - name: Restart Project Zomboid
      ansible.builtin.systemd_service:
        name: project-zomboid
        state: restarted
        daemon_reload: true
